apiVersion: 1

groups:
  - orgId: 1
    name: fraud-scoring
    folder: Fraud monitoring
    interval: 10s
    rules:
      - uid: fraud-share-high
        title: Доля фрода выше 5%
        condition: C
        for: 30s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "Доля транзакций с флагом фрода за минуту выше 5%: {{ humanizePercentage $values.B.Value }}"
          description: Возможна атака или сломанная модель. Проверьте дашборд «1. Скоринг транзакций».
        data:
          - refId: A
            relativeTimeRange: {from: 120, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              expr: sum(rate(fraud_scoring_flagged_total[1m])) / sum(rate(fraud_scoring_transactions_total[1m]))
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.05]

      - uid: stream-stopped
        title: Поток транзакций остановился
        condition: C
        for: 30s
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "Скоринг обрабатывает меньше 1 транзакции в секунду: {{ $values.B.Value }}"
          description: Остановился симулятор, Kafka или сервис fraud_detector.
        data:
          - refId: A
            relativeTimeRange: {from: 120, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              expr: sum(rate(fraud_scoring_transactions_total[30s]))
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
